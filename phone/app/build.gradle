plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huchuan.phone'
    compileSdk 34

    defaultConfig {
        applicationId "com.huchuan.phone"
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName "0.6.10"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
